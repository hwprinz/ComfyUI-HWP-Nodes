name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-node:
    runs-on: ubuntu-latest
    # Changelog shown in the registry's Updates section: defaults to the
    # pushed commit's message (e.g. "v0.9.7: ...").
    env:
      COMFY_NODE_CHANGELOG: ${{ github.event.head_commit.message }}
    steps:
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
